<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Calendrier / Agenda - Exemple</title>
  <link rel="stylesheet" href="calendar.css">
</head>
<body>
  <div class="wrap">
    <div class="card" id="calendarCard" aria-label="Calendrier">
      <header>
        <div class="month-nav">
          <button id="prevMonth" aria-label="Mois précédent">◀</button>
          <div class="title" id="monthTitle">Septembre 2025</div>
          <button id="nextMonth" aria-label="Mois suivant">▶</button>
        </div>
        <div>
          <input type="date" id="gotoDate" class="small" title="Aller à la date" />
          <button id="todayBtn">Aujourd'hui</button>
        </div>
      </header>

      <div class="grid" id="weekdays">
        <div class="weekday">Lun</div>
        <div class="weekday">Mar</div>
        <div class="weekday">Mer</div>
        <div class="weekday">Jeu</div>
        <div class="weekday">Ven</div>
        <div class="weekday">Sam</div>
        <div class="weekday">Dim</div>
      </div>

      <div class="grid" id="daysGrid" role="grid" aria-label="Jours du mois">
        <!-- Jours générés en JS -->
      </div>

      <div style="margin-top:10px; font-size:0.9rem; color:var(--muted)">Sélectionne une date pour créer un événement. Clique une deuxième date pour créer une période.</div>
    </div>

    <aside class="card sidebar" aria-label="Éditeur d'événement">
      <div style="font-weight:700">Nouvel événement</div>
      <div class="form-row">
        <label class="small">Titre</label>
        <input id="evtTitle" placeholder="Titre de l'événement" />
      </div>
      <div class="form-row">
        <label class="small">Date / Période</label>
        <div style="display:flex; gap:8px">
          <input type="date" id="startDate" />
          <input type="date" id="endDate" />
        </div>
        <div style="display:flex; gap:8px; margin-top:6px">
          <input type="time" id="startTime" />
          <input type="time" id="endTime" />
        </div>
        <label style="font-size:0.8rem; color:var(--muted)"><input type="checkbox" id="allDay" /> Toute la journée</label>
      </div>

      <div class="form-row">
        <label class="small">Description</label>
        <textarea id="evtDesc" rows="3" placeholder="Optionnel"></textarea>
      </div>

      <div class="actions">
        <button id="addEvt" class="primary">Ajouter</button>
        <button id="clearForm">Réinitialiser</button>
      </div>

      <hr />
    </aside>
  </div>
  <script src="calendar.js"></script>
</body>
</html>
